<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مشغّل الصوتيات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشغّل">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" id="ati" href="">
<link rel="manifest" id="mf" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--sf:#fff;--ink:#0E1B26;--mut:#5B6B78;--ac:#0B6E6E;--acf:#fff;--ln:#D9E1E7;--on:#DDF0EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1218;--sf:#16202A;--ink:#E8EEF2;--mut:#93A4B1;--ac:#4FD1C5;--acf:#06201D;--ln:#243340;--on:#153631}}
:root[data-theme="dark"]{--bg:#0C1218;--sf:#16202A;--ink:#E8EEF2;--mut:#93A4B1;--ac:#4FD1C5;--acf:#06201D;--ln:#243340;--on:#153631}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:270px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 16px 8px;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:22px;font-weight:600;margin:0}
.add{background:var(--ac);color:var(--acf);border-radius:12px;padding:9px 14px;font-weight:500;display:flex;gap:6px;align-items:center}
.add input{display:none}
.tools{display:flex;gap:8px;margin-top:10px}
.tools input{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.tab{border:1px solid var(--ln);border-radius:10px;padding:0 12px;background:var(--sf);color:var(--mut)}
.tab.a{background:var(--ac);color:var(--acf);border-color:var(--ac)}
ul{list-style:none;margin:0;padding:4px 16px}
.row{display:flex;align-items:center;border-bottom:1px solid var(--ln)}
.row.on{background:var(--on);border-radius:10px;border-color:transparent}
.pl{flex:1;min-width:0;text-align:right;padding:12px 8px;display:flex;flex-direction:column}
.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.du{font-size:13px;color:var(--mut)}
.ib{width:42px;height:42px;display:grid;place-items:center;color:var(--mut)}
.ib.fv{color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:60px 24px}
.pn{position:fixed;inset-inline:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);border-radius:20px 20px 0 0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.08)}
#nm{font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{display:flex;justify-content:space-between;direction:ltr;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;direction:ltr;accent-color:var(--ac);margin:6px 0}
.ct{display:flex;justify-content:space-between;align-items:center;direction:ltr;margin-top:4px}
.ct button{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;position:relative}
.ct .big{width:64px;height:64px;background:var(--ac);color:var(--acf)}
.ct .on{color:var(--ac)}
.b1{position:absolute;font-size:9px;font-weight:600;top:20px;left:0;right:0;text-align:center}
.sc{display:flex;justify-content:center;gap:10px;margin-top:8px}
.sc button{border:1px solid var(--ln);border-radius:20px;padding:5px 14px;font-size:14px;color:var(--mut)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);inset-inline:20px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
 <div class="top"><h1>مكتبتي الصوتية</h1>
  <label class="add"><span id="plus"></span>إضافة ملفات<input id="fi" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.alac,.caf,.aif,.aiff,.ogg,.opus,.mp4" multiple></label></div>
 <div class="tools"><input id="q" type="search" placeholder="بحث في المكتبة"><button class="tab a" data-t="all">الكل</button><button class="tab" data-t="fav">المفضلة</button></div>
</header>
<ul id="ls"></ul>
<div class="empty" id="em" hidden>المكتبة فارغة.<br>اضغط «إضافة ملفات» لاختيار ملفات صوتية من جهازك؛ تُحفظ نسخة منها داخل التطبيق على جهازك.</div>
<section class="pn">
 <div id="nm">اختر ملفاً للتشغيل</div>
 <input type="range" id="sk" min="0" max="1000" value="0" aria-label="شريط التقدم">
 <div class="tm"><span id="cu">0:00</span><span id="to">0:00</span></div>
 <div class="ct">
  <button id="sh" aria-label="عشوائي"></button>
  <button id="pv" aria-label="السابق"></button>
  <button id="pp" class="big" aria-label="تشغيل"></button>
  <button id="nx" aria-label="التالي"></button>
  <button id="rp" aria-label="تكرار"></button>
 </div>
 <div class="sc"><button id="sp">السرعة 1×</button><button id="sl">مؤقّت النوم: إيقاف</button></div>
</section>
<div id="toast" role="status"></div>
<audio id="au" preload="auto" playsinline></audio>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const P={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zm8 0h4v14h-4z',next:'M6 18l8.5-6L6 6zM16 6h2v12h-2z',prev:'M6 6h2v12H6zm3.5 6l8.5 6V6z',
shuffle:'M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5',repeat:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',
star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',plus:'M12 5v14M5 12h14'};
const F={play:1,pause:1,next:1,prev:1};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" width="${n==='play'||n==='pause'?30:24}" height="${n==='play'||n==='pause'?30:24}" ${F[n]||f?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'}><path d="${P[n]}"/></svg>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{if(!isFinite(s)||s<0)return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${r}`:`${m}:${r}`};
let db,tracks=[],view=[],cur=null,url=null,tab='all',qs='',shuf=false,rep=0,sleepT=null,sleepI=0,spI=1;
const SP=[.75,1,1.25,1.5,2],SL=[0,15,30,60];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),3200)}
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const st=m=>db.transaction('t',m).objectStore('t');
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('audio-player',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function load(){tracks=await rq(st('readonly').getAll());render()}

function render(){
 view=tracks.filter(t=>(tab==='all'||t.fav)&&t.title.toLowerCase().includes(qs)).sort((a,b)=>a.title.localeCompare(b.title,'ar'));
 $('#ls').innerHTML=view.map(t=>`<li class="row${cur&&cur.id===t.id?' on':''}" data-id="${t.id}"><button class="pl" data-a="play"><span class="tt">${esc(t.title)}</span><span class="du">${fmt(t.dur)}</span></button><button class="ib${t.fav?' fv':''}" data-a="fav" aria-label="مفضلة">${ic('star',t.fav)}</button><button class="ib" data-a="del" aria-label="حذف">${ic('trash')}</button></li>`).join('');
 const e=$('#em');e.hidden=view.length>0;if(tracks.length&&!view.length)e.textContent='لا توجد نتائج.';else if(!tracks.length)e.innerHTML='المكتبة فارغة.<br>اضغط «إضافة ملفات» لاختيار ملفات صوتية من جهازك؛ تُحفظ نسخة منها داخل التطبيق على جهازك.';
}
function dur(f){return new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f);const d=v=>{URL.revokeObjectURL(u);ok(v)};a.preload='metadata';a.onloadedmetadata=()=>d(a.duration);a.onerror=()=>d(-1);a.src=u;setTimeout(()=>d(0),5000)})}
$('#fi').onchange=async e=>{
 const fs=[...e.target.files];let ok=0,bad=[];
 for(let i=0;i<fs.length;i++){const f=fs[i];toast(`جارٍ الإضافة ${i+1} من ${fs.length}…`);
  const d=await dur(f);if(d<0){bad.push(f.name);continue}
  try{await rq(st('readwrite').add({title:f.name.replace(/\.[^.]+$/,''),blob:f,dur:d,fav:0,added:Date.now()}));ok++}catch(x){toast('تعذّر الحفظ: المساحة غير كافية أو التخزين معطّل.');break}}
 e.target.value='';await load();
 toast(bad.length?`أُضيف ${ok}، وتعذّر ${bad.length} لأن صيغتها غير مدعومة في هذا الجهاز.`:`تمت إضافة ${ok} ملف.`);
};
function play(t){
 cur=t;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(t.blob);au.src=url;au.playbackRate=SP[spI];
 au.play().catch(()=>toast('اضغط زر التشغيل للبدء.'));
 $('#nm').textContent=t.title;render();
 if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'مكتبتي الصوتية'})}
}
function step(d,auto){
 if(!view.length)return;let i=view.findIndex(t=>cur&&t.id===cur.id);
 if(shuf&&view.length>1){let n;do{n=Math.floor(Math.random()*view.length)}while(n===i);return play(view[n])}
 i+=d;if(i>=view.length||i<0){if(rep===1||!auto)i=(i+view.length)%view.length;else return}
 play(view[i]);
}
$('#ls').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;const id=+b.closest('li').dataset.id,t=tracks.find(x=>x.id===id),a=b.dataset.a;
 if(a==='play')play(t);
 if(a==='fav'){t.fav=t.fav?0:1;await rq(st('readwrite').put(t));render()}
 if(a==='del'&&confirm('حذف هذا الملف من المكتبة؟')){if(cur&&cur.id===id){au.pause();au.removeAttribute('src');cur=null;$('#nm').textContent='اختر ملفاً للتشغيل'}await rq(st('readwrite').delete(id));await load()}
};
$('#q').oninput=e=>{qs=e.target.value.trim().toLowerCase();render()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('a',x===b));render()});

const tg=()=>{if(!cur&&view.length)return play(view[0]);au.paused?au.play():au.pause()};
$('#pp').onclick=tg;$('#nx').onclick=()=>step(1);$('#pv').onclick=()=>{au.currentTime>3?au.currentTime=0:step(-1)};
$('#sh').onclick=()=>{shuf=!shuf;ui()};
$('#rp').onclick=()=>{rep=(rep+1)%3;ui()};
$('#sp').onclick=()=>{spI=(spI+1)%SP.length;au.playbackRate=SP[spI];$('#sp').textContent=`السرعة ${SP[spI]}×`};
$('#sl').onclick=()=>{sleepI=(sleepI+1)%SL.length;clearTimeout(sleepT);const m=SL[sleepI];$('#sl').textContent=m?`مؤقّت النوم: ${m} د`:'مؤقّت النوم: إيقاف';if(m)sleepT=setTimeout(()=>{au.pause();sleepI=0;$('#sl').textContent='مؤقّت النوم: إيقاف'},m*60000)};
function ui(){
 $('#sh').innerHTML=ic('shuffle');$('#sh').className=shuf?'on':'';
 $('#rp').innerHTML=ic('repeat')+(rep===2?'<span class="b1">1</span>':'');$('#rp').className=rep?'on':'';
 $('#pv').innerHTML=ic('prev');$('#nx').innerHTML=ic('next');
 $('#pp').innerHTML=ic(au.paused?'play':'pause');$('#plus').innerHTML=ic('plus');
}
let seeking=false;
$('#sk').oninput=e=>{seeking=true;$('#cu').textContent=fmt(e.target.value/1000*au.duration)};
$('#sk').onchange=e=>{au.currentTime=e.target.value/1000*au.duration;seeking=false};
au.ontimeupdate=()=>{if(!seeking&&au.duration){$('#sk').value=au.currentTime/au.duration*1000;$('#cu').textContent=fmt(au.currentTime)}
 if('mediaSession'in navigator&&au.duration&&navigator.mediaSession.setPositionState){try{navigator.mediaSession.setPositionState({duration:au.duration,position:au.currentTime,playbackRate:au.playbackRate})}catch(x){}}};
au.onloadedmetadata=()=>$('#to').textContent=fmt(au.duration);
au.onplay=au.onpause=ui;
au.onended=()=>{if(rep===2){au.currentTime=0;au.play()}else step(1,true)};
au.onerror=()=>{if(cur)toast('تعذّر تشغيل هذا الملف؛ الصيغة قد لا تكون مدعومة.')};
if('mediaSession'in navigator){const m=navigator.mediaSession,h=(k,f)=>{try{m.setActionHandler(k,f)}catch(x){}};
 h('play',()=>au.play());h('pause',()=>au.pause());h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1));
 h('seekbackward',()=>au.currentTime-=10);h('seekforward',()=>au.currentTime+=10);h('seekto',d=>au.currentTime=d.seekTime)}

// Home-screen icon + manifest
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0B6E6E';x.fillRect(0,0,180,180);
 x.fillStyle='#fff';x.beginPath();x.moveTo(70,52);x.lineTo(70,128);x.lineTo(132,90);x.closePath();x.fill();
 const d=c.toDataURL('image/png');$('#ati').href=d;
 $('#mf').href=URL.createObjectURL(new Blob([JSON.stringify({name:'مشغّل الصوتيات',short_name:'مشغّل',display:'standalone',start_url:location.href,background_color:'#0C1218',theme_color:'#0B6E6E',lang:'ar',dir:'rtl',icons:[{src:d,sizes:'180x180',type:'image/png'}]})],{type:'application/manifest+json'}))}catch(x){}})();

ui();
openDB().then(d=>{db=d;load();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})})
 .catch(()=>{$('#em').hidden=false;$('#em').textContent='التخزين المحلي غير متاح في هذا الوضع (قد يكون التصفح الخاص مفعّلاً).'});
</script>
</body>
</html>
